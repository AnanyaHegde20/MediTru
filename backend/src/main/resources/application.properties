# MediTru Backend - Spring Boot Configuration
server.port=3001
server.tomcat.max-http-form-post-size=10MB

# CORS
meditru.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Gemini AI
meditru.gemini.api-key=${GEMINI_API_KEY:}
meditru.gemini.model=gemini-3.7-flash

# Rate Limiting
meditru.rate-limit.max-requests=100
meditru.rate-limit.window-ms=60000
