# MediTru Backend - Spring Boot Configuration
server.port=3001
server.tomcat.max-http-form-post-size=10MB

# CORS
meditru.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Gemini AI
meditru.gemini.api-key=${GEMINI_API_KEY:}
meditru.gemini.model=gemini-3.7-flash

# Rate Limiting
meditru.rate-limit.max-requests=100
meditru.rate-limit.window-ms=60000

# H2 Database
spring.datasource.url=jdbc:h2:mem:meditru;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
